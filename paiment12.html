<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency - Payment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/paiment.css">
    
</head>
<body>
    <div class="container">
        

        <div class="progress">
            <div>Trip</div>
            <div>Details</div>
            <div class="active">Payment</div>
        </div>

        <div class="main">
            <!-- Left Form -->
            <div class="form-card">
                <h3>Customer Information</h3>
                <label>Full Name</label>
                <input type="text" placeholder="John Doe">
                <label>Email Address</label>
                <input type="email" placeholder="email@example.com">
                <label>Phone Number</label>
                <input type="text" placeholder="+216 XXX XXX XXX">

                <h3>Payment Method</h3>
                <div class="payment-tabs">
                    <button class="active">Credit Card</button>
                    <button>PayPal</button>
                    <button>Cash</button>
                </div>
                <label>Card Number</label>
                <input type="text" placeholder="1234 5678 9012 3456">
                <div class="billing">
                    <input type="text" placeholder="MM / YY">
                    <input type="text" placeholder="CVV">
                </div>

                <h3>Billing Address (Optional)</h3>
                <input type="text" placeholder="Street Address">
                <div class="billing">
                    <input type="text" placeholder="City">
                    <input type="text" placeholder="ZIP Code">
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="terms"> I agree to the <a href="#">Terms & Conditions</a>
                </div>

                <button class="btn">Pay Now</button>
            </div>

            <!-- Right Summary -->
            <div class="summary-card">
                <h4>Trip Summary</h4>
                <p>Destination: Makkah</p>
                <p>Hotel: Hilton ⭐⭐⭐⭐⭐</p>
                <p>Dates: 12 Aug - 20 Aug</p>

                <h4>Price Details</h4>
                <p>Subtotal: 6500 TND</p>
                <p>Taxes: 500 TND</p>
                <p class="price">Total: 7000 TND</p>

                <div class="promo">
                    <input type="text" placeholder="Promo Code">
                    <button>Apply</button>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
